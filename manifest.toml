#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "kutt"
name = "Kutt"
description.en = "URL Shortener"
description.fr = "Raccourcisseur d'URL"

version = "3.2.3~ynh1"

maintainers = ["eric_G"]

[upstream]
license = "MIT"
website = "https://kutt.it/"
code = "https://github.com/thedevs-network/kutt"

[integration]
yunohost = ">= 12.0.9"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false

sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "user"

[resources]

    [resources.sources]

        [resources.sources.main]
        url = "https://github.com/thedevs-network/kutt/archive/refs/tags/v3.2.3.tar.gz"
        sha256 = "32a65986e235cd6f67be8399614133fa2355ebbe2dddd3f9865c3e13d84bdb83"
        autoupdate.strategy = "latest_github_tag"

    [resources.system_user]
    allow_email = true
    
    [resources.install_dir]

    [resources.permissions]
    main.url = "/"
    api.url = "/api"
    api.allowed = "visitors"
    api.auth_header = false
    api.show_tile = false

    [resources.ports]

    [resources.apt]
    packages = "postgresql, redis-server"

    [resources.database]
    type = "postgresql"
